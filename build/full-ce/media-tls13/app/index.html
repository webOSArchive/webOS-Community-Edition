<!doctype html>
<html><head><title>Media TLS 1.3</title></head>
<body style="background:#000;color:#ccc;font-family:sans-serif;padding:40px">
<p>Media TLS 1.3 has no user interface. It replaces the GStreamer HTTP source used by
every audio and video player on the device with a libcurl-based one (TLS 1.3, SNI),
so streams from modern HTTPS servers play.</p>
</body></html>
